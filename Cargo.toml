[package]
name = "cmudb"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
log = "0.4.29"
ordered-float = "5.3.0"
parking_lot = "0.12.5"
rand = "0.9.2"
sqlparser = "0.62.0"
tempfile = "3.23.0"
criterion = { version = "0.7", optional = true, default-features = false, features = ["cargo_bench_support"] }

[features]
bench = ["dep:criterion"]
deadlock_detection = ["parking_lot/deadlock_detection"]
testing = []

[dev-dependencies]
cmudb = { path = ".", features = ["testing"] }

[[bench]]
name = "storage"
harness = false
required-features = ["bench"]

[[bench]]
name = "index"
harness = false
required-features = ["bench"]

[[bench]]
name = "query"
harness = false
required-features = ["bench"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
