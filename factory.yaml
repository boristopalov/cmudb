# The loop between our agents.
#
# Each role is a plain prompt in agents/<name>.md plus the settings under
# `agents:` below. `targets:` maps those neutral settings to each harness;
# generate.py writes the files each harness reads (.claude/agents/ for
# Claude Code, codex/AGENTS.md for Codex). Edit agents/ and this file, never
# the generated files.
#
# Linear is the queue. Issue states:
#   Backlog      new or needs a decision; triage works these
#   Todo         ready; any agent may pick it up
#   In Progress  an agent is working on it or its PR is open
#   Done         the PR merged (by an agent through the merge gate, or by Boris)
#
# Each stage says how it starts:
#   enforced_by: a workflow in the consuming repo runs it automatically.
#   scheduled:   the hourly loop run hands it to the coordinator, which
#                starts it (see `handoff:`).
# Nothing here is executed by a runtime; this file is the spec, and the
# workflows and scheduled run it names are what actually run.
version: 1

queue: { linear: { project: cmudb, team: BOR } }

# model: strong or fast. tools: all, or a list of read, shell, edit, pr_comment.
agents:
  triage:
    description: Triages the project's Linear issues so agents know what they may pick up. Use on new or Backlog issues, or on a scheduled pass.
    model: fast
    tools: all
  implement:
    description: Implements a triaged work item and opens a pull request. Use when the acceptance criteria are clear.
    model: strong
    tools: all
  review:
    description: Reviews a pull request's changes and reports real problems ranked by severity. Read-only; comments but never edits or approves.
    model: strong
    tools: [read, shell, pr_comment]
  test:
    description: Adds tests to raise coverage and catch regressions on a branch or PR. Use when coverage is below the gate or a change lacks tests.
    model: fast
    tools: all
  benchmark:
    description: Measures performance of a change against a baseline. Runs by hand, never in CI.
    model: fast
    tools: all
  judge:
    description: Evaluates past agent sessions and their PRs against rubric.md for failure modes, and proposes changes to the factory in an agent-factory PR. Runs weekly.
    model: strong
    tools: all

targets:
  claude-code:
    models: { strong: opus, fast: sonnet }
    tools:
      read: [Read, Grep, Glob]
      shell: [Bash]
      edit: [Edit, Write]
      pr_comment: [mcp__github_inline_comment__create_inline_comment]
  codex:
    # Codex uses the model in your Codex config; set one here to pin it.
    models: {}
    # Roles without edit say to start Codex with --sandbox read-only;
    # AGENTS.md can't enforce that itself.

stages:
  triage:
    agent: triage
    trigger: { linear: { state: Backlog } }
    scheduled: true
    next: implement            # by moving the issue to Todo

  implement:
    agent: implement
    trigger: { linear: { state: Todo } }
    scheduled: true
    max_parallel: 5
    sets_state: In Progress
    output: pull_request
    watches_own_pr: true       # subscribes to its PR's CI and review events, fixes until merge-ready
    next: [review, test]

  review:
    agent: review
    trigger: { github: { pull_request: [opened, synchronize, reopened, ready_for_review] } }
    enforced_by: .github/workflows/claude-review.yml
    next: implement            # findings wake the PR's implementer

  test:
    agent: test
    trigger: { gate_failed: coverage }
    scheduled: true

  benchmark:
    agent: benchmark
    trigger: { on_request: true }   # by hand, never in CI

  judge:
    agent: judge
    trigger: { schedule: weekly }   # never in CI
    scheduled: true
    inputs: [recent agent sessions, their PRs and diffs, rubric.md, ledger.md]
    limits: { max_proposals: 3, min_sessions: 2 }
    output: findings report, plus a pull_request on agent-factory

# A PR is merge-ready when every gate passes. The implement agent may merge
# its own PR only when `merge` allows it; anything else waits for Boris.
gates:
  ci_green:        { enforced_by: .github/workflows/ci.yml }
  coverage:        { min_lines: 80, enforced_by: .github/workflows/ci.yml }
  review_findings: { rule: "no open correctness or concurrency findings" }
  merge:
    agent_may_merge_when:      # read from the latest review summary on the current head
      checks: all_green
      verdict: pass
      risk: [low, medium]
      confidence: high
    never_self_merge: ['.github/**', 'agents/**', '.claude/**', 'codex/**', factory.yaml, rubric.md, 'rust-toolchain*']
    on_permission_block: stop_and_report   # never another way to merge; the coordinator passes Boris's go-ahead
    otherwise: boris
    stacked: bottom_first

# Scheduled loop runs can't message the coordinator session or start agents,
# so each run posts its handoff on the project timeline. The coordinator
# wakes on every post and starts the implement agents.
handoff:
  post_starts_with: "Loop handoff for the coordinator: Todo issues ready for implement agents:"
  lists: Todo issues, highest priority first, one line each with key, title and priority
  own_post: true             # never combined with a ping to Boris
  quiet_hours: ignored       # it's for the coordinator, not Boris
  skip_when: [list is empty, list unchanged since the last handoff post]
  coordinator:
    max_running: stages.implement.max_parallel
    skip: issues not in Todo now, or with a running agent   # the post is a snapshot; check Linear first
    # An unchanged list posts nothing, so issues left over when all slots were
    # full would wait for the next change to Todo. When an implement agent
    # finishes, the coordinator starts the next one still in Todo.
    on_agent_done: start the highest-priority issue from the latest handoff post that is still in Todo

# When the loop pings Boris. Everything else, agents handle.
ping_boris:
  when:
    - a PR is merge-ready but the gate leaves it to him (high risk, or confidence below high)
    - an issue is flagged "Needs Boris:"
    - work is stuck (CI red or a review finding unresolved after two attempts)
  own_post: true             # separate from the handoff post
  quiet_hours: { from: "22:00", to: "09:00", tz: America/Los_Angeles }   # no pings then; the first run after 9am sends one combined ping
