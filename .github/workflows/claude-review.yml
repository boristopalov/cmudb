name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review
        required: true
        type: number

jobs:
  review:
    uses: boristopalov/agent-factory/.github/workflows/review.yml@claude/review-runs-tests
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      hint: |
        Before reviewing, run cargo build and cargo test and report in the summary whether they ran and passed.
        cmudb is a Rust DBMS modeled on CMU's BusTub (buffer pool, disk scheduler,
        table heap, B+ tree index with latch crabbing, binder/planner/executors).
        Also check:
        - SQL semantics: NULL handling, joins, aggregates.
        - Page and slot layout: off-by-one errors in offsets and sizes.
        - Concurrency: latch and lock ordering, pins that are never released, guards
          held across I/O or across calls that can re-enter the buffer pool.
        - The comment policy in CONTRIBUTING.md: knowledge that should be in code
          (types, asserts, Result errors, named constants, tests), not comments.
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
